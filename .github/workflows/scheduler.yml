# =============================================================================
# [تنظیم ۱]: نام نمایشی ورک‌فلو
# =============================================================================
name: Dogs SK Bot Runner

on:
  # قابلیت اجرای دستی از تب Actions و تحریک با کران‌جاب cron-job.org
  workflow_dispatch:

# =============================================================================
# [تنظیم ۲]: قفل هم‌زمانی (Concurrency)
# =============================================================================
concurrency:
  group: dogs-sk-bot-group
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ۱. لود کردن خودکار فایل وضعیت از حافظه کش مخفی گیت‌هاب
      - name: Restore State Cache
        uses: actions/cache/restore@v4
        with:
          path: dogs_sk_state.json
          key: dogs-sk-state-cache-${{ github.run_id }}
          restore-keys: |
            dogs-sk-state-cache-

      # ۲. ایجاد فایل اولیه در صورت اولین اجرای پروژه
      - name: Ensure state file exists
        run: |
          if [ ! -f dogs_sk_state.json ]; then echo "{}" > dogs_sk_state.json; fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon aiohttp python-dotenv

      # ۳. ساخت فایل accounts.json از سکرت تعریف‌شده
      - name: Create accounts.json from Secrets
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
        run: |
          echo "$ACCOUNTS_JSON" > accounts.json

      # ۴. اجرای اسکریپت اصلی به صورت خط به خط و بدون بافر (-u)
      - name: Run bot runner
        env:
          PYTHONUNBUFFERED: "1"
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: python -u dogs_sk_bot.py

      # ۵. ذخیره وضعیت جدید dogs_sk_state.json در کش مخفی برای اجرای ۲۰ دقیقه بعد
      - name: Save State Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: dogs_sk_state.json
          key: dogs-sk-state-cache-${{ github.run_id }}
